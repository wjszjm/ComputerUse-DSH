name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '22'
            python: '3.12'
          - node: '24'
            python: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install Python package
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".\win-desktop-control[dev]"
          .\.venv\Scripts\python.exe -m pip check
      - name: Build Windows Graphics Capture helper
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\build-window-capture.ps1
      - name: Run isolated test suite
        shell: pwsh
        run: pwsh -NoProfile -File .\run-tests.ps1
