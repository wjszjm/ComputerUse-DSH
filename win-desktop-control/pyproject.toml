[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "win-desktop-control"
version = "1.0.0"
description = "Windows desktop-control MCP plugin for LLM agents (screenshot + mouse + keyboard + window control)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ComputerUse-DSH contributors" }]
keywords = ["mcp", "computer-use", "windows", "automation", "agent", "pyautogui"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
]

dependencies = [
  "mss>=9.0.1",
  "Pillow>=10.0.0",
  "pyautogui>=0.9.54",
  "pyperclip>=1.8.2",
  "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]
uia = ["uiautomation>=2.0.18"]

[project.scripts]
wdc = "wdc.cli:main"

[project.urls]
Homepage = "https://github.com/wjszjm/ComputerUse-DSH"
Repository = "https://github.com/wjszjm/ComputerUse-DSH"
Issues = "https://github.com/wjszjm/ComputerUse-DSH/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wdc = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
